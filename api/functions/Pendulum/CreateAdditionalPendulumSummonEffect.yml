---!function
name: CreateAdditionalPendulumSummonEffect
namespace: Pendulum
description: >-
  Creates an additional Pendulum Summon effect to be registered or granted to a card(s).
status:
  index: stable
parameters:
  - name: handler
    type: [ Card ]
    description: The card that is creating the effect.
  - name: pendulum_filter
    type: [ function ]
    description: Additional filter to be applied to the monsters that can be Pendulum Summoned.
    defaultValue: aux.TRUE
  - name: pendulum_location
    type: [ int ]
    description: The location where the additional Pendulum Summon effect can Pendulum Summon from.
    defaultValue: LOCATION_HAND|LOCATION_EXTRA
  - name: effect_description
    type: [ int ]
    description: The description of the additional Pendulum Summon effect.
    defaultValue: 1163 (`Pendulum Summon`)
  - name: owner_card_id
    type: [ int ]
    description: The ID of the card that is creating the effect.
  - name: reset
    type: [ int ]
    description: Reset for the additional Pendulum Summon effect.
    required: false
    defaultValue: RESET_PHASE|PHASE_END
  - name: reset_count
    type: [ int ]
    description: Reset count for the additional Pendulum Summon effect.
    required: false
    defaultValue: 1
returns:
  - type: [ Effect ]
    description: The created additional Pendulum Summon effect.
