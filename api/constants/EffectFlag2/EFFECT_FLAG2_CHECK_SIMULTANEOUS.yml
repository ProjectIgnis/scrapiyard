---!constant
name: EFFECT_FLAG2_CHECK_SIMULTANEOUS
enum: EffectFlag2
value: 0x0004
description: A Trigger Effect with this flag will not trigger if the card was sent to its triggering location in the same timing as the event that triggered it (e.g., [the ruling for "Virtual World Hime - Nyannyan"](https://db.ygoresources.com/qa#23126)).
summary: Trigger Effect that won't trigger if sent to its location in the same timing.
status:
  index: stable
