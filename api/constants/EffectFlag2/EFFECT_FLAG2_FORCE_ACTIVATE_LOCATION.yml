---!constant
name: EFFECT_FLAG2_FORCE_ACTIVATE_LOCATION
enum: EffectFlag2
value: 0x40000000
description: A [card activation effect](/api/constants/EffectType/EFFECT_TYPE_ACTIVATE) with this flag places the card in the location specified in [`Effect.SetValue`](/api/functions/Effect/SetValue) when it activates. The location can only be one of [`LOCATION_MZONE`](/api/constants/Location/LOCATION_MZONE), [`LOCATION_SZONE`](/api/constants/Location/LOCATION_SZONE), or [`LOCATION_FZONE`](/api/constants/Location/LOCATION_FZONE).
summary: Card activation that places the card in a given location when activated.
status:
  index: unstable
  message: May be deprecated later in favor of handling the default locations natively.
tags: [ unofficial ]
